<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>Demo carousel, slide 2</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      /*
        CONTENT SLIDE (slides 2 to N). Layout: top row, headline, motion stage, progress.
        The default stage is a checklist that ticks (technique "checklist tick" in
        references/motion-menu.md). Replace the stage markup and the STAGE block in the
        script with another technique from the menu; keep the headline and top row.

        Rule: the slide is fully settled by about 60 percent of its length, then holds.

        Design tokens: keep these identical to slide 1.
      */
      :root {
        --ground: oklch(0.255 0.035 165);
        --ground-line: oklch(0.34 0.035 165);
        --surface: oklch(0.31 0.04 165);
        --ink: oklch(0.965 0.012 110);
        --muted: oklch(0.82 0.025 140);
        --accent: oklch(0.88 0.165 100);
        --on-accent: oklch(0.24 0.035 165);
        --font-display: "League Gothic", "Oswald", sans-serif;
        --font-body: "Outfit", "Montserrat", sans-serif;
        --margin: 88px;
        --head-size: 124px;
        --item-size: 46px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
        color: var(--ink);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
      }

      #top {
        position: absolute;
        left: var(--margin);
        right: var(--margin);
        top: 84px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 30px;
        font-weight: 500;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      #head {
        position: absolute;
        left: var(--margin);
        right: var(--margin);
        top: 196px;
      }
      .headline {
        font-family: var(--font-display);
        font-weight: 400;
        font-size: var(--head-size);
        line-height: 0.95;
        letter-spacing: 0.004em;
        max-width: 904px;
      }
      /* One .line per visual line, so the entrance can lift each line separately. */
      .line {
        display: block;
      }

      /* ---------- STAGE: card stack deal (motion menu 5, variant) ---------- */
      #stage {
        position: absolute;
        left: var(--margin);
        right: var(--margin);
        top: 540px;
        height: 600px;
      }
      .doc {
        position: absolute;
        left: 0;
        right: 0;
        height: 176px;
        display: flex;
        align-items: center;
        gap: 36px;
        padding: 0 44px;
        background: var(--ink);
        color: var(--on-accent);
        border-radius: 18px;
        box-shadow: 0 18px 40px -18px oklch(0.15 0.03 165 / 0.7);
      }
      /* First document on top of the stack, so items deal out in reading order */
      .doc:nth-child(1) { top: 0; z-index: 3; }
      .doc:nth-child(2) { top: 206px; z-index: 2; }
      .doc:nth-child(3) { top: 412px; z-index: 1; }
      .doc-icon {
        flex: none;
        width: 64px;
        height: 80px;
      }
      .doc-title {
        font-size: 46px;
        line-height: 1.1;
        font-weight: 600;
      }
      .doc-sub {
        margin-top: 8px;
        font-size: 32px;
        line-height: 1.2;
        font-weight: 400;
        color: oklch(0.42 0.03 165);
      }
      /* ---------- end STAGE ---------- */

      /* Progress through the carousel: fill width = slide index / total */
      #progress {
        position: absolute;
        left: var(--margin);
        right: var(--margin);
        bottom: 96px;
        height: 6px;
        background: var(--ground-line);
        border-radius: 3px;
        overflow: hidden;
      }
      .progress-fill {
        width: 100%;
        height: 100%;
        background: var(--accent);
        transform-origin: 0% 50%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="slide"
      data-start="0"
      data-duration="6"
      data-fps="30"
      data-width="1080"
      data-height="1350"
      data-slide-index="2"
      data-slide-total="2"
    >
      <header id="top">
        <span class="handle">@your_handle</span>
        <span class="count">2 / 2</span>
      </header>

      <section id="head">
        <h2 class="headline">
          <span class="line">Start with these three,</span>
          <span class="line">every buyer asks for them</span>
        </h2>
      </section>

      <section id="stage">
        <div class="doc">
          <svg class="doc-icon" viewBox="0 0 64 80" aria-hidden="true"><path d="M6 4 H42 L58 20 V76 H6 Z" fill="oklch(0.88 0.165 100)" stroke="oklch(0.24 0.035 165)" stroke-width="4" stroke-linejoin="round" /><path d="M16 38 H48 M16 50 H48 M16 62 H38" stroke="oklch(0.24 0.035 165)" stroke-width="4" stroke-linecap="round" /></svg>
          <div><p class="doc-title" data-layout-allow-overlap data-layout-allow-occlusion>Tax returns</p><p class="doc-sub" data-layout-allow-overlap data-layout-allow-occlusion>The last three years</p></div>
        </div>
        <div class="doc">
          <svg class="doc-icon" viewBox="0 0 64 80" aria-hidden="true"><path d="M6 4 H42 L58 20 V76 H6 Z" fill="oklch(0.88 0.165 100)" stroke="oklch(0.24 0.035 165)" stroke-width="4" stroke-linejoin="round" /><path d="M16 38 H48 M16 50 H48 M16 62 H38" stroke="oklch(0.24 0.035 165)" stroke-width="4" stroke-linecap="round" /></svg>
          <div><p class="doc-title" data-layout-allow-overlap data-layout-allow-occlusion>Profit and loss</p><p class="doc-sub" data-layout-allow-overlap data-layout-allow-occlusion>This year, to date</p></div>
        </div>
        <div class="doc">
          <svg class="doc-icon" viewBox="0 0 64 80" aria-hidden="true"><path d="M6 4 H42 L58 20 V76 H6 Z" fill="oklch(0.88 0.165 100)" stroke="oklch(0.24 0.035 165)" stroke-width="4" stroke-linejoin="round" /><path d="M16 38 H48 M16 50 H48 M16 62 H38" stroke="oklch(0.24 0.035 165)" stroke-width="4" stroke-linecap="round" /></svg>
          <div><p class="doc-title" data-layout-allow-overlap data-layout-allow-occlusion>Your current lease</p><p class="doc-sub" data-layout-allow-overlap data-layout-allow-occlusion>Terms, rent and how long is left</p></div>
        </div>
      </section>

      <div id="progress"><div class="progress-fill"></div></div>
    </div>

    <script>
      const root = document.getElementById("root");
      const INDEX = Number(root.dataset.slideIndex);
      const TOTAL = Number(root.dataset.slideTotal);
      const tl = gsap.timeline({ paused: true });

      // Shared entrance (not the primary technique): headline lines rise in, 0.1 to 0.7 s.
      tl.fromTo(
        ".line",
        { y: 36, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.1 },
        0.1
      );

      // Progress bar grows from the previous slide's position to this one.
      tl.fromTo(
        ".progress-fill",
        { scaleX: (INDEX - 1) / TOTAL },
        { scaleX: INDEX / TOTAL, duration: 0.8, ease: "power2.out" },
        0.2
      );

      // ---------- STAGE: card stack deal ----------
      // The three documents start stacked on the first slot (first one on top),
      // slightly rotated, then the lower ones slide out into a list. Settled by about 2.9 s (under 60 percent of 6 s).
      const SLOT = 206;
      const docs = gsap.utils.toArray(".doc");
      docs.forEach((d, i) => {
        tl.fromTo(d, { opacity: 0, y: -i * SLOT + 30, rotation: [-3, 2.5, -1.5][i] }, { opacity: 1, y: -i * SLOT, duration: 0.45, ease: "power3.out" }, 0.5 + i * 0.12);
      });
      docs.forEach((d, i) => {
        if (i === 0) {
          tl.to(d, { rotation: 0, duration: 0.5, ease: "power3.out" }, 1.4);
          return;
        }
        tl.to(d, { y: 0, rotation: 0, duration: 0.7, ease: "power4.out" }, 1.4 + i * 0.4);
      });
      // ---------- end STAGE ----------

      window.__timelines["slide"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
