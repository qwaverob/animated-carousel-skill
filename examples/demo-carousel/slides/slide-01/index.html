<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>Demo carousel, slide 1 (cover)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      /*
        COVER SLIDE. Frame 0 is the Instagram cover, so the whole hook is on screen
        from the first frame. Nothing here fades, types or masks the hook in.
        Motion is decorative only: the ledger lines drift and the swipe cue nudges.

        Design tokens: change these once per carousel and use the same values on
        every slide. One accent color, used for small fills only.
      */
      :root {
        --ground: oklch(0.255 0.035 165);
        --ground-line: oklch(0.34 0.035 165);
        --ink: oklch(0.965 0.012 110);
        --muted: oklch(0.82 0.025 140);
        --accent: oklch(0.88 0.165 100);
        --font-display: "League Gothic", "Oswald", sans-serif;
        --font-body: "Outfit", "Montserrat", sans-serif;
        --margin: 88px;
        --hook-size: 156px;
        --context-size: 42px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
        color: var(--ink);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
      }

      /* Background: thin ledger lines that drift slowly. Decorative, never hit-testable. */
      #bg {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .ledger {
        position: absolute;
        left: 0;
        top: -90px;
        width: 1080px;
        height: 1530px;
        background-image: repeating-linear-gradient(
          180deg,
          transparent 0px,
          transparent 89px,
          var(--ground-line) 89px,
          var(--ground-line) 90px
        );
      }

      /* Top row: handle and slide position */
      #top {
        position: absolute;
        left: var(--margin);
        right: var(--margin);
        top: 84px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 30px;
        font-weight: 500;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      /* The hook block sits a little above center, left aligned */
      #hook {
        position: absolute;
        left: var(--margin);
        right: var(--margin);
        top: 300px;
      }
      .hook-inner {
        transform-origin: 0% 50%;
      }
      .rule {
        width: 168px;
        height: 14px;
        background: var(--accent);
        margin-bottom: 44px;
      }
      .headline {
        font-family: var(--font-display);
        font-weight: 400;
        font-size: var(--hook-size);
        line-height: 0.94;
        letter-spacing: 0.004em;
        color: var(--ink);
        max-width: 904px;
        text-wrap: balance;
      }
      .context {
        margin-top: 48px;
        font-size: var(--context-size);
        line-height: 1.3;
        font-weight: 400;
        color: var(--muted);
        max-width: 820px;
        text-wrap: pretty;
      }

      /* Swipe cue, bottom left */
      #cue {
        position: absolute;
        left: var(--margin);
        bottom: 96px;
        display: flex;
        align-items: center;
        gap: 22px;
        font-size: 34px;
        font-weight: 600;
        color: var(--ink);
      }
      .cue-arrow {
        width: 96px;
        height: 36px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="slide"
      data-start="0"
      data-duration="6"
      data-fps="30"
      data-width="1080"
      data-height="1350"
    >
      <div id="bg">
        <div class="ledger"></div>
      </div>

      <header id="top">
        <span class="handle">@your_handle</span>
        <span class="count">1 / 2</span>
      </header>

      <main id="hook">
        <div class="hook-inner">
          <div class="rule"></div>
          <h1 class="headline">The documents a buyer asks for before making an offer</h1>
          <p class="context">Have them ready and the first serious conversation goes a lot faster.</p>
        </div>
      </main>

      <footer id="cue">
        <span>Swipe</span>
        <svg class="cue-arrow" viewBox="0 0 96 36" aria-hidden="true">
          <g class="cue-move">
            <path d="M2 18 H88" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" />
            <path d="M74 5 L90 18 L74 31" stroke="var(--accent)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
          </g>
        </svg>
      </footer>
    </div>

    <script>
      // One paused timeline. Duration of the video is the root data-duration (6 s).
      const DUR = 6;
      const tl = gsap.timeline({ paused: true });

      // Ledger lines drift up one line height over the whole slide. Linear on purpose.
      tl.fromTo(".ledger", { y: 0 }, { y: -90, duration: DUR, ease: "none" }, 0);

      // The hook block breathes forward by 2 percent. It is fully readable at frame 0.
      tl.fromTo(".hook-inner", { scale: 1 }, { scale: 1.02, duration: DUR, ease: "sine.inOut" }, 0);

      // Swipe cue nudges right twice. It is visible from frame 0 as well.
      [1.2, 3.4].forEach((t) => {
        tl.to(".cue-move", { x: 14, duration: 0.35, ease: "power2.out" }, t);
        tl.to(".cue-move", { x: 0, duration: 0.55, ease: "power3.inOut" }, t + 0.35);
      });

      window.__timelines["slide"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
